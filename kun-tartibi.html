<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kun tartibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{
  --ink:#070a1f;
  --paper:#f4f6ff;
  --muted:rgba(232,236,255,.7);
  --line:rgba(255,255,255,.13);
  --panel:rgba(7,10,30,.6);
  --sun:#ffd66b;
  --orb:#ffd66b;
  --display:'Unbounded',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body{
  margin:0;min-height:100%;
  background:#0a0f2e;color:var(--paper);
  font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---------- sky ---------- */
.sky{position:fixed;inset:0;z-index:-3;background:linear-gradient(#0a0f2e,#1d2454)}
.stars{position:fixed;inset:0;z-index:-2;opacity:0;transition:opacity 3s;pointer-events:none}
.stars i{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.scrim{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 30%,rgba(3,5,20,0) 0%,rgba(3,5,20,.5) 100%),rgba(4,6,22,.2)}

/* ---------- layout ---------- */
.app{max-width:1260px;margin:0 auto;padding:clamp(18px,3.2vw,44px)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(2.1rem,5.6vw,4rem);letter-spacing:-.025em;line-height:1.02}
.date{margin:.7rem 0 0;font-size:1.08rem;color:var(--muted)}
.stats{display:flex;gap:34px}
.stat .num{display:block;font-family:var(--display);font-weight:500;font-size:1.65rem;line-height:1.1}
.stat .lab{display:block;margin-top:4px;font-size:.88rem;color:var(--muted)}

.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:clamp(20px,3.4vw,52px);align-items:start;margin-top:clamp(20px,3vw,36px)}

/* ---------- dial ---------- */
.dial-wrap{position:relative;width:min(100%,690px);aspect-ratio:1;margin-inline:auto;container-type:inline-size}
#dial{width:100%;height:100%;display:block;overflow:visible;cursor:copy}
.hlab{font-family:var(--display);font-size:15px;fill:rgba(255,255,255,.82)}
.alab{font-family:var(--body);font-weight:650;font-size:13px;fill:#0a0f26;pointer-events:none;letter-spacing:.01em}
.arc{cursor:pointer;transition:stroke-width .18s,opacity .2s}
.arc:hover,.arc.hl{stroke-width:37}
.arc.active{stroke-width:35;filter:url(#glow)}
.arc.done{opacity:.4}
.arc:focus-visible{outline:none;stroke-width:38;filter:url(#glow)}
.arc.anim{stroke-dasharray:1 3;animation:draw 1.15s cubic-bezier(.2,.75,.2,1) both;animation-delay:var(--d,0s)}
@keyframes draw{from{stroke-dashoffset:1.02}to{stroke-dashoffset:0}}

.core{position:absolute;left:50%;top:50%;width:32%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:max(4px,1.1cqw);text-align:center;pointer-events:none}
.clock{font-family:var(--display);font-weight:500;font-size:max(24px,8.4cqw);line-height:1;letter-spacing:-.02em;white-space:nowrap;display:inline-flex;align-items:baseline}
.dg{display:inline-block;width:.7em;text-align:center}
.co{display:inline-block;width:.3em;text-align:center;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.now-tag{font-size:max(10px,1.9cqw);color:var(--muted);display:flex;align-items:center;gap:.55em}
.now-tag i{display:block;width:.75em;height:.75em;border-radius:50%;background:var(--c,#fff)}
.now-title{font-weight:600;font-size:max(12px,2.7cqw);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now-sub{font-size:max(10px,2cqw);color:var(--muted)}

/* ---------- plan ---------- */
.plan{position:sticky;top:16px;background:var(--panel);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:26px;padding:22px 20px 18px}
.plan-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;padding:0 4px}
.plan-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:1.08rem}
.rows{list-style:none;margin:0;padding:0;max-height:calc(100vh - 250px);min-height:120px;overflow-y:auto;overscroll-behavior:contain}
.row{position:relative;display:grid;grid-template-columns:34px 1fr;align-items:center;padding-left:14px;
  border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 var(--c);transition:background .2s,opacity .2s}
.row:hover,.row.hl{background:rgba(255,255,255,.06)}
.row.active{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 28%,transparent),transparent 90%)}
.row.done{opacity:.6}
.row.done .title{text-decoration:line-through}
.row-main{background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%;
  padding:12px 8px;display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;border-radius:12px}
.time{display:grid;font-variant-numeric:tabular-nums;line-height:1.25}
.time b{font-weight:650;font-size:.95rem}
.time small{font-size:.8rem;color:var(--muted)}
.title{font-weight:600;font-size:1.02rem;line-height:1.25;padding-right:54px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px;font-size:.82rem;color:var(--muted)}
.meta .cat{display:inline-flex;align-items:center;gap:6px}
.meta .cat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pill{position:absolute;right:8px;top:12px;background:var(--c);color:var(--ink);font-weight:700;font-size:.74rem;padding:2px 10px;border-radius:999px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;position:relative;transition:background .2s,transform .15s;padding:0}
.check:hover{transform:scale(1.08)}
.check[aria-pressed="true"]{background:var(--c)}
.check[aria-pressed="true"]::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid var(--ink);border-width:0 2.6px 2.6px 0;transform:rotate(45deg)}
.nowline{display:flex;align-items:center;gap:10px;height:26px;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--sun);list-style:none}
.nowline::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--sun),transparent)}
.empty{padding:26px 8px;color:var(--muted);list-style:none}
.empty strong{display:block;color:var(--paper);font-size:1.05rem;margin-bottom:6px}
.plan-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.plan-foot .note{flex-basis:100%;font-size:.8rem;color:var(--muted);margin-top:4px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.95rem;padding:11px 18px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--paper);cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.btn.primary{background:var(--paper);color:var(--ink);border-color:transparent}
.btn.primary:hover{background:#fff}
.btn.small{font-size:.83rem;padding:8px 14px;font-weight:500}
.btn.danger{color:#ff8f9b;border-color:rgba(255,143,155,.35)}
.btn svg{width:16px;height:16px}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line);border-radius:28px;background:#0c1032;color:var(--paper);padding:0;width:min(480px,calc(100vw - 28px));box-shadow:0 30px 90px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(3,5,18,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog[open]{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.dlg-body{padding:26px 24px 22px;display:grid;gap:18px}
.dlg-body h3{margin:0;font-family:var(--display);font-weight:500;font-size:1.25rem}
.field{display:grid;gap:8px;font-size:.9rem;color:var(--muted)}
.field input{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--paper);font:inherit;font-size:1rem;width:100%}
.field input:focus{outline:2px solid #fff;outline-offset:1px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.16);background:transparent;color:var(--paper);font-size:.9rem;cursor:pointer;transition:background .2s,border-color .2s}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-checked="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 24%,transparent)}
.err{margin:0;min-height:1.2em;color:#ff9aa5;font-size:.9rem}
.dlg-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--paper);color:var(--ink);padding:12px 20px;border-radius:999px;font-weight:600;font-size:.95rem;box-shadow:0 12px 40px rgba(0,0,0,.4);
  transition:opacity .3s,transform .3s;max-width:calc(100vw - 32px);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .stage{grid-template-columns:1fr}
  .plan{position:static}
  .rows{max-height:none}
}
@media (max-width:520px){
  .stats{gap:24px}
  .row-main{grid-template-columns:58px 1fr}
  .times{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .arc.anim{animation:none;stroke-dasharray:none}
  .stars i,.co{animation:none}
  dialog[open]{animation:none}
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>

<main class="app">
  <header class="top">
    <div>
      <h1>Kun tartibi</h1>
      <p class="date" id="dateLine"></p>
    </div>
    <div class="stats">
      <div class="stat"><span class="num" id="statDone">0/0</span><span class="lab">bajarildi</span></div>
      <div class="stat"><span class="num" id="statDay">0%</span><span class="lab">kun o‘tdi</span></div>
    </div>
  </header>

  <section class="stage">
    <div class="dial-wrap" id="dialWrap">
      <svg id="dial" viewBox="0 0 700 700" role="group" aria-label="24 soatlik kun tartibi halqasi. Yarim tun tepada, tush pastda."></svg>
      <div class="core" id="core" aria-live="off"></div>
    </div>

    <aside class="plan" aria-label="Bugungi reja">
      <div class="plan-head">
        <h2>Bugungi reja</h2>
        <button class="btn primary" id="addBtn" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>
          Vazifa qo‘shish
        </button>
      </div>
      <ol class="rows" id="rows"></ol>
      <div class="plan-foot">
        <button class="btn small" id="sampleBtn" type="button" data-label="Namuna kunni yuklash">Namuna kunni yuklash</button>
        <button class="btn small" id="clearBtn" type="button" data-label="Hammasini tozalash">Hammasini tozalash</button>
        <span class="note">Halqadagi bo‘sh joyni bossangiz, o‘sha vaqtga vazifa qo‘shiladi. Ma’lumotlar shu qurilmada saqlanadi.</span>
      </div>
    </aside>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-body">
    <h3 id="dlgTitle">Yangi vazifa</h3>
    <label class="field"><span>Nomi</span>
      <input id="fTitle" type="text" maxlength="60" placeholder="Masalan: Ertalabki mashq" autocomplete="off">
    </label>
    <div class="times">
      <label class="field"><span>Boshlanishi</span><input id="fStart" type="time"></label>
      <label class="field"><span>Tugashi</span><input id="fEnd" type="time"></label>
    </div>
    <div class="field"><span id="catLabel">Turi</span><div class="chips" id="fCats" role="radiogroup" aria-labelledby="catLabel"></div></div>
    <p class="err" id="fErr" role="alert"></p>
    <div class="dlg-actions">
      <button class="btn danger" id="delBtn" type="button" hidden>O‘chirish</button>
      <span class="grow"></span>
      <button class="btn" id="cancelBtn" type="button">Bekor qilish</button>
      <button class="btn primary" id="saveBtn" type="button">Saqlash</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= konstantalar ================= */
var $ = function(s){ return document.querySelector(s); };
var CATS = {
  ish:     { name:'Ish',       color:'#7d9bff' },
  oqish:   { name:'O‘qish',    color:'#b99cff' },
  sport:   { name:'Sport',     color:'#ff6f7d' },
  ovqat:   { name:'Ovqat',     color:'#ffc45c' },
  dam:     { name:'Dam olish', color:'#4fe0c0' },
  uyqu:    { name:'Uyqu',      color:'#7f8fe0' },
  shaxsiy: { name:'Shaxsiy',   color:'#f592d2' }
};
var CAT_KEYS = Object.keys(CATS);
var LANES = [250, 210, 170, 130];
var C = 350;
var KEY = 'kun-tartibi:v1';
var DAYS = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
var MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];

/* ================= yordamchilar ================= */
function pad(n){ return String(n).padStart(2,'0'); }
function fmt(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); }
function toMin(v){ var p = v.split(':'); return (+p[0]) * 60 + (+p[1]); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function nowMin(d){ d = d || new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
function dur(t){ return (t.end - t.start + 1440) % 1440; }
function durTxt(m){
  if (m < 60) return m + ' daq';
  var h = Math.floor(m/60), r = m % 60;
  return h + ' soat' + (r ? ' ' + r + ' daq' : '');
}
function remainTxt(m){
  m = Math.max(1, Math.ceil(m));
  if (m < 60) return 'yana ' + m + ' daqiqa';
  var h = Math.floor(m/60), r = m % 60;
  return 'yana ' + h + ' soat' + (r ? ' ' + r + ' daqiqa' : '');
}
function afterTxt(m){
  m = Math.max(1, Math.ceil(m));
  if (m < 60) return m + ' daqiqadan keyin';
  var h = Math.floor(m/60), r = m % 60;
  return r ? h + ' soat ' + r + ' daqiqadan keyin' : h + ' soatdan keyin';
}

/* ================= ma'lumotlar ================= */
function sample(){
  var S = [
    ['Uyqu','uyqu','23:00','06:30'],
    ['Ertalabki yugurish','sport','06:30','07:00'],
    ['Nonushta','ovqat','07:00','07:45'],
    ['Asosiy ish','ish','08:00','12:00'],
    ['Jamoa yig‘ilishi','ish','10:00','10:45'],
    ['Tushlik','ovqat','12:00','13:00'],
    ['Qisqa dam olish','dam','13:00','13:30'],
    ['Loyiha ustida ishlash','ish','13:30','17:00'],
    ['Ingliz tili','oqish','17:30','19:00'],
    ['Kechki ovqat','ovqat','19:00','20:00'],
    ['Oila bilan vaqt','shaxsiy','20:00','21:30'],
    ['Kitob o‘qish','oqish','21:30','22:30'],
    ['Kunni yakunlash','shaxsiy','22:30','23:00']
  ];
  return S.map(function(s){ return { id:uid(), title:s[0], cat:s[1], start:toMin(s[2]), end:toMin(s[3]), doneOn:null }; });
}
function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var d = JSON.parse(raw); if (Array.isArray(d)) return d; }
  } catch(e) {}
  return null;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e) {} }
var tasks = load() || sample();

function byStart(){ return tasks.slice().sort(function(a,b){ return a.start - b.start || a.end - b.end; }); }
function segs(t){ return t.end > t.start ? [[t.start,t.end]] : [[t.start,1440],[0,t.end]]; }
function overlaps(a,b){
  var sa = segs(a), sb = segs(b);
  for (var i=0;i<sa.length;i++) for (var j=0;j<sb.length;j++) if (sa[i][0] < sb[j][1] && sb[j][0] < sa[i][1]) return true;
  return false;
}
function assignLanes(){
  var order = tasks.slice().sort(function(a,b){ return dur(b) - dur(a) || a.start - b.start; });
  var lanes = [], map = {};
  order.forEach(function(t){
    var placed = false;
    for (var i=0;i<lanes.length;i++){
      if (!lanes[i].some(function(o){ return overlaps(o,t); })) { lanes[i].push(t); map[t.id] = i; placed = true; break; }
    }
    if (!placed){
      if (lanes.length < LANES.length) { lanes.push([t]); map[t.id] = lanes.length - 1; }
      else { lanes[LANES.length-1].push(t); map[t.id] = LANES.length - 1; }
    }
  });
  return map;
}
function inSeg(t,n){ return t.end > t.start ? (n >= t.start && n < t.end) : (n >= t.start || n < t.end); }
function activeTask(n){
  var best = null, be = 1e9;
  tasks.forEach(function(t){
    if (inSeg(t,n)) { var el = (n - t.start + 1440) % 1440; if (el < be) { be = el; best = t; } }
  });
  return best;
}
function nextTask(n, exclude){
  var best = null, bd = 1e9;
  tasks.forEach(function(t){
    if (exclude && t.id === exclude.id) return;
    var d = (t.start - n + 1440) % 1440;
    if (d > 0 && d < bd) { bd = d; best = t; }
  });
  return best ? { t:best, d:bd } : null;
}

/* ================= osmon ================= */
var SKY = [
  [0,'#050818','#111738'],[4.5,'#0a0f2e','#1d2454'],[6,'#2d3080','#d97a9c'],[7.5,'#3f6fd0','#ffc08a'],
  [10,'#2f74d6','#82c0f2'],[15,'#2a68c8','#78b4ee'],[17.5,'#3a5cb8','#ffa66e'],[19,'#33297a','#e0607a'],
  [20.5,'#12163f','#4a3a86'],[22,'#070a22','#17204a'],[24,'#050818','#111738']
];
function h2r(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mixc(a,b,t){
  var A = h2r(a), B = h2r(b);
  return 'rgb(' + A.map(function(v,i){ return Math.round(v + (B[i]-v)*t); }).join(',') + ')';
}
function nightness(h){
  if (h < 4.5 || h >= 21) return 1;
  if (h < 6.5) return 1 - (h - 4.5)/2;
  if (h < 18) return 0;
  return (h - 18)/3;
}
function setSky(h){
  for (var i=0;i<SKY.length-1;i++){
    if (h >= SKY[i][0] && h < SKY[i+1][0]){
      var t = (h - SKY[i][0]) / (SKY[i+1][0] - SKY[i][0]);
      var top = mixc(SKY[i][1], SKY[i+1][1], t), bot = mixc(SKY[i][2], SKY[i+1][2], t);
      $('#sky').style.background = 'linear-gradient(180deg,' + top + ',' + bot + ')';
      break;
    }
  }
  var nt = nightness(h);
  $('#stars').style.opacity = nt.toFixed(2);
  document.documentElement.style.setProperty('--orb', mixc('#ffd66b','#dfe6ff', nt));
}
(function makeStars(){
  var h = '';
  for (var i=0;i<110;i++){
    var sz = (Math.random()*1.8 + .6).toFixed(1);
    h += '<i style="left:' + (Math.random()*100).toFixed(1) + '%;top:' + (Math.random()*75).toFixed(1) + '%;width:' + sz + 'px;height:' + sz + 'px;animation-delay:' + (-Math.random()*5).toFixed(1) + 's;animation-duration:' + (2+Math.random()*4).toFixed(1) + 's"></i>';
  }
  $('#stars').innerHTML = h;
})();

/* ================= halqa (dial) ================= */
function pol(r,deg){ var a = deg*Math.PI/180; return [C + r*Math.sin(a), C - r*Math.cos(a)]; }
function arcD(r,a0,a1,rev){
  if (a1 - a0 >= 360) a1 = a0 + 359.9;
  var large = (a1 - a0) > 180 ? 1 : 0;
  var p0 = pol(r,a0), p1 = pol(r,a1);
  function f(p){ return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }
  return rev ? 'M' + f(p1) + 'A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + f(p0)
             : 'M' + f(p0) + 'A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + f(p1);
}
var today = todayKey();
function isDone(t){ return t.doneOn === today; }

function renderDial(animate){
  today = todayKey();
  var lanes = assignLanes();
  var act = activeTask(nowMin());
  var s = '';
  s += '<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
       '<radialGradient id="orbg"><stop offset="0" style="stop-color:var(--orb)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--orb)" stop-opacity="0"/></radialGradient></defs>';

  s += '<circle cx="350" cy="350" r="108" fill="rgba(4,7,24,.55)" stroke="rgba(255,255,255,.12)"/>';
  LANES.forEach(function(r){ s += '<circle cx="350" cy="350" r="' + r + '" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="32"/>'; });

  // kun va tun yoyi
  s += '<path d="' + arcD(292,90,285) + '" fill="none" stroke="#ffd98a" stroke-width="4" opacity=".85" stroke-linecap="round"/>';
  s += '<path d="' + arcD(292,285,450) + '" fill="none" stroke="#7482e0" stroke-width="4" opacity=".75" stroke-linecap="round"/>';

  // soat belgilari
  for (var h=0; h<24; h++){
    var major = h % 3 === 0, ang = h*15;
    var p1 = pol(302,ang), p2 = pol(major ? 317 : 309, ang);
    s += '<line x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) + '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) + '" stroke="rgba(255,255,255,' + (major ? .75 : .32) + ')" stroke-width="' + (major ? 2 : 1.2) + '" stroke-linecap="round"/>';
    if (major){
      var pl = pol(338,ang);
      s += '<text class="hlab" x="' + pl[0].toFixed(1) + '" y="' + pl[1].toFixed(1) + '" text-anchor="middle" dy=".35em">' + pad(h) + '</text>';
    }
  }

  // vazifalar
  var labels = '';
  var sorted = byStart();
  sorted.forEach(function(t,i){
    var lane = lanes[t.id] || 0, r = LANES[lane];
    var cat = CATS[t.cat] || CATS.ish;
    var a0 = t.start/4 + .35;
    var a1 = (t.end > t.start ? t.end : t.end + 1440)/4 - .35;
    if (a1 - a0 < .8) a1 = a0 + .8;
    var cls = 'arc' + (act && act.id === t.id ? ' active' : '') + (isDone(t) ? ' done' : '') + (animate ? ' anim' : '');
    var range = fmt(t.start) + ' dan ' + fmt(t.end) + ' gacha';
    s += '<path class="' + cls + '" data-id="' + t.id + '" d="' + arcD(r,a0,a1) + '" pathLength="1" fill="none" stroke="' + cat.color + '" stroke-width="32" stroke-linecap="butt" ' +
         'tabindex="0" role="button" aria-label="' + esc(t.title) + ', ' + range + '. Tahrirlash uchun bosing" style="--d:' + (i*0.07).toFixed(2) + 's"><title>' + esc(t.title) + ' — ' + fmt(t.start) + '–' + fmt(t.end) + '</title></path>';
    // yorug‘ chekka
    s += '<path d="' + arcD(r+14,a0,a1) + '" fill="none" stroke="rgba(255,255,255,.38)" stroke-width="2" pointer-events="none"' + (isDone(t) ? ' opacity=".4"' : '') + '/>';

    // yoy bo‘ylab yozuv
    var mid = ((a0 + a1)/2) % 360, rev = mid > 90 && mid < 270;
    var arcLen = (a1 - a0) * Math.PI/180 * r;
    var maxCh = Math.floor((arcLen - 14) / 7.6);
    var title = (isDone(t) ? '✓ ' : '') + t.title;
    if (maxCh >= 4){
      if (title.length > maxCh) title = title.slice(0, maxCh - 1).trimEnd() + '…';
      labels += '<path id="lp' + i + '" d="' + arcD(r,a0,a1,rev) + '" fill="none"/>' +
                '<text class="alab" dy=".35em"' + (isDone(t) ? ' opacity=".6"' : '') + '><textPath href="#lp' + i + '" startOffset="50%" text-anchor="middle">' + esc(title) + '</textPath></text>';
    }
  });
  s += labels;

  // soniya nuqtasi (yadro atrofida)
  s += '<g id="sechand"><circle cx="350" cy="242" r="3.5" fill="#fff" opacity=".85"/></g>';

  // hozirgi vaqt ko‘rsatkichi
  s += '<g id="hand"><line x1="350" y1="238" x2="350" y2="66" stroke="rgba(255,255,255,.55)" stroke-width="1.6" stroke-dasharray="2 6" stroke-linecap="round"/>' +
       '<circle cx="350" cy="58" r="22" fill="url(#orbg)"/>' +
       '<circle cx="350" cy="58" r="9" style="fill:var(--orb)" stroke="rgba(255,255,255,.9)" stroke-width="2"/></g>';

  $('#dial').innerHTML = s;
}

/* ================= reja ro'yxati ================= */
function renderRows(sorted, mi, act, d){
  var rows = $('#rows');
  if (!sorted.length){
    rows.innerHTML = '<li class="empty"><strong>Hali vazifa yo‘q</strong>Halqadan vaqt tanlang yoki “Vazifa qo‘shish” tugmasini bosing.</li>';
    return;
  }
  var html = '', markerAdded = false;
  var marker = '<li class="nowline" aria-hidden="true"><span>' + fmt(Math.floor(nowMin(d))) + '</span></li>';
  sorted.forEach(function(t,i){
    if (i === mi){ html += marker; markerAdded = true; }
    var cat = CATS[t.cat] || CATS.ish, done = isDone(t), isAct = act && act.id === t.id;
    html += '<li class="row' + (isAct ? ' active' : '') + (done ? ' done' : '') + '" data-id="' + t.id + '" style="--c:' + cat.color + '">' +
      '<button class="check" type="button" data-act="toggle" aria-pressed="' + done + '" aria-label="' + esc(t.title) + ': bajarildi deb belgilash"></button>' +
      '<button class="row-main" type="button" data-act="edit" aria-label="' + esc(t.title) + ' vazifasini tahrirlash">' +
        '<span class="time"><b>' + fmt(t.start) + '</b><small>' + fmt(t.end) + '</small></span>' +
        '<span><span class="title">' + esc(t.title) + '</span>' +
        '<span class="meta"><span class="cat">' + cat.name + '</span><span>' + durTxt(dur(t)) + '</span></span></span>' +
      '</button>' +
      (isAct ? '<span class="pill">hozir</span>' : '') +
    '</li>';
  });
  if (!markerAdded) html += marker;
  rows.innerHTML = html;
}

/* ================= yadro (markaz) ================= */
function digits(s){ return s.split('').map(function(c){ return '<span class="dg">' + c + '</span>'; }).join(''); }
function coreHTML(d, n, act){
  var clock = '<div class="clock">' + digits(pad(d.getHours())) + '<span class="co">:</span>' + digits(pad(d.getMinutes())) + '</div>';
  var st = '';
  if (act){
    var cat = CATS[act.cat] || CATS.ish;
    var rem = (act.end - n + 1440) % 1440;
    st = '<div class="now-tag" style="--c:' + cat.color + '"><i></i>Hozir</div><div class="now-title">' + esc(act.title) + '</div><div class="now-sub">' + remainTxt(rem) + '</div>';
  } else {
    var nx = nextTask(n, null);
    if (nx){
      var c2 = CATS[nx.t.cat] || CATS.ish;
      st = '<div class="now-tag" style="--c:rgba(255,255,255,.5)"><i></i>Bo‘sh vaqt</div><div class="now-title">' + esc(nx.t.title) + '</div><div class="now-sub">' + afterTxt(nx.d) + '</div>';
    } else {
      st = '<div class="now-title">Reja bo‘sh</div><div class="now-sub">Vazifa qo‘shing</div>';
    }
  }
  return clock + st;
}

/* ================= sarlavha va statistika ================= */
function updateChrome(d, n){
  $('#dateLine').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + '-' + MONTHS[d.getMonth()] + ', ' + d.getFullYear();
  var td = todayKey(d);
  var done = tasks.filter(function(t){ return t.doneOn === td; }).length;
  $('#statDone').textContent = done + '/' + tasks.length;
  $('#statDay').textContent = Math.floor(n/1440*100) + '%';
  var nl = $('#rows .nowline span');
  if (nl) nl.textContent = fmt(Math.floor(n));
}

/* ================= asosiy tsikl ================= */
var lastSig = '', lastMinute = -1, lastCoreKey = '', lastActive, firstRender = true;
var toastTimer;
function toast(msg){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3800);
}

function tick(){
  var d = new Date(), n = nowMin(d), act = activeTask(n);
  var sorted = byStart(), mi = sorted.length;
  for (var i=0;i<sorted.length;i++){ if (sorted[i].start > n){ mi = i; break; } }
  var sig = JSON.stringify(tasks) + '|' + (act ? act.id : '-') + '|' + mi + '|' + todayKey(d);
  if (sig !== lastSig){
    lastSig = sig;
    renderDial(firstRender);
    renderRows(sorted, mi, act, d);
    firstRender = false;
    lastCoreKey = '';
    lastMinute = -1;
  }
  var aid = act ? act.id : null;
  if (lastActive !== undefined && aid && aid !== lastActive){
    toast('Boshlandi: ' + act.title + ' (' + fmt(act.start) + '–' + fmt(act.end) + ')');
  }
  lastActive = aid;

  var mk = Math.floor(n);
  if (mk !== lastMinute){ lastMinute = mk; setSky(n/60); updateChrome(d, n); }
  var ck = mk + '|' + aid + '|' + tasks.length;
  if (ck !== lastCoreKey){ lastCoreKey = ck; $('#core').innerHTML = coreHTML(d, n, act); }

  var hand = $('#hand');
  if (hand) hand.setAttribute('transform', 'rotate(' + (n/1440*360).toFixed(3) + ' 350 350)');
  var sh = $('#sechand');
  if (sh) sh.setAttribute('transform', 'rotate(' + (d.getSeconds()*6) + ' 350 350)');
}
function forceRender(){ lastSig = ''; tick(); }

/* ================= sichqoncha va klaviatura ================= */
function setHover(id){
  document.querySelectorAll('.hl').forEach(function(el){ el.classList.remove('hl'); });
  if (id) document.querySelectorAll('[data-id="' + id + '"]').forEach(function(el){ el.classList.add('hl'); });
}
var dial = $('#dial'), rows = $('#rows');

dial.addEventListener('click', function(e){
  var arc = e.target.closest('.arc');
  if (arc){ openDlg(arc.dataset.id); return; }
  var rect = dial.getBoundingClientRect();
  var dx = e.clientX - (rect.left + rect.width/2), dy = e.clientY - (rect.top + rect.height/2);
  var rr = Math.hypot(dx, dy) / (rect.width/2);
  if (rr < 0.33 || rr > 0.9) return;
  var deg = (Math.atan2(dx, -dy) * 180/Math.PI + 360) % 360;
  var start = (Math.round(deg/360*1440/15) * 15) % 1440;
  openDlg(null, { start:start, end:(start + 60) % 1440 });
});
dial.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('arc')){
    e.preventDefault(); openDlg(e.target.dataset.id);
  }
});
dial.addEventListener('mouseover', function(e){ var a = e.target.closest('.arc'); setHover(a ? a.dataset.id : null); });
dial.addEventListener('mouseleave', function(){ setHover(null); });
rows.addEventListener('mouseover', function(e){ var r = e.target.closest('.row'); setHover(r ? r.dataset.id : null); });
rows.addEventListener('mouseleave', function(){ setHover(null); });

rows.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var row = b.closest('.row'); if (!row) return;
  var id = row.dataset.id;
  if (b.dataset.act === 'edit'){ openDlg(id); return; }
  var t = tasks.find(function(x){ return x.id === id; });
  if (!t) return;
  t.doneOn = isDone(t) ? null : todayKey();
  save(); forceRender();
  var nb = document.querySelector('.row[data-id="' + id + '"] .check');
  if (nb) nb.focus();
});

/* ================= dialog ================= */
var dlg = $('#dlg'), fTitle = $('#fTitle'), fStart = $('#fStart'), fEnd = $('#fEnd'), fCats = $('#fCats'), fErr = $('#fErr'), delBtn = $('#delBtn');
var editId = null, selCat = 'ish', delTimer;

function buildChips(){
  fCats.innerHTML = CAT_KEYS.map(function(k){
    return '<button type="button" class="chip" role="radio" data-cat="' + k + '" style="--c:' + CATS[k].color + '" aria-checked="' + (k === selCat) + '"><i></i>' + CATS[k].name + '</button>';
  }).join('');
}
fCats.addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  selCat = b.dataset.cat;
  fCats.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-checked', c.dataset.cat === selCat); });
});
function defaultStart(){ return (Math.ceil(nowMin()/30) * 30) % 1440; }
function openDlg(id, preset){
  editId = id;
  var t = id ? tasks.find(function(x){ return x.id === id; }) : null;
  $('#dlgTitle').textContent = t ? 'Vazifani tahrirlash' : 'Yangi vazifa';
  fTitle.value = t ? t.title : '';
  var st = t ? t.start : (preset ? preset.start : defaultStart());
  var en = t ? t.end : (preset ? preset.end : (defaultStart() + 60) % 1440);
  fStart.value = fmt(st); fEnd.value = fmt(en);
  selCat = t ? t.cat : 'ish';
  buildChips();
  fErr.textContent = '';
  delBtn.hidden = !t;
  delBtn.textContent = 'O‘chirish';
  delBtn.dataset.armed = '';
  clearTimeout(delTimer);
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open','');
  fTitle.focus();
}
function closeDlg(){ if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
function saveDlg(){
  var title = fTitle.value.trim();
  if (!title){ fErr.textContent = 'Vazifa nomini yozing.'; fTitle.focus(); return; }
  if (!fStart.value || !fEnd.value){ fErr.textContent = 'Boshlanish va tugash vaqtini tanlang.'; return; }
  var s = toMin(fStart.value), e = toMin(fEnd.value);
  if (s === e){ fErr.textContent = 'Boshlanish va tugash vaqti bir xil bo‘lmasligi kerak.'; return; }
  if (editId){
    var t = tasks.find(function(x){ return x.id === editId; });
    if (t){ t.title = title; t.cat = selCat; t.start = s; t.end = e; }
  } else {
    tasks.push({ id:uid(), title:title, cat:selCat, start:s, end:e, doneOn:null });
  }
  save(); closeDlg(); forceRender(); toast('Saqlandi: ' + title);
}
$('#saveBtn').addEventListener('click', saveDlg);
$('#cancelBtn').addEventListener('click', closeDlg);
$('#addBtn').addEventListener('click', function(){ openDlg(null); });
fTitle.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); saveDlg(); } });
dlg.addEventListener('click', function(e){ if (e.target === dlg) closeDlg(); });
delBtn.addEventListener('click', function(){
  if (delBtn.dataset.armed){
    clearTimeout(delTimer);
    tasks = tasks.filter(function(x){ return x.id !== editId; });
    save(); closeDlg(); forceRender(); toast('O‘chirildi');
  } else {
    delBtn.dataset.armed = '1';
    delBtn.textContent = 'Rostdan o‘chirilsinmi?';
    delTimer = setTimeout(function(){ delBtn.dataset.armed = ''; delBtn.textContent = 'O‘chirish'; }, 3000);
  }
});

/* ================= pastki tugmalar (ikki bosqichli) ================= */
function twoStep(btn, action){
  var timer;
  btn.addEventListener('click', function(){
    if (btn.dataset.armed){
      clearTimeout(timer); btn.dataset.armed = ''; btn.textContent = btn.dataset.label; action();
    } else {
      btn.dataset.armed = '1'; btn.textContent = 'Aniqmi? Yana bosing';
      timer = setTimeout(function(){ btn.dataset.armed = ''; btn.textContent = btn.dataset.label; }, 3000);
    }
  });
}
twoStep($('#sampleBtn'), function(){ tasks = sample(); save(); firstRender = true; forceRender(); toast('Namuna kun yuklandi'); });
twoStep($('#clearBtn'),  function(){ tasks = []; save(); forceRender(); toast('Reja tozalandi'); });

/* ================= boshlash ================= */
setSky(nowMin()/60);
tick();
setInterval(tick, 1000);
})();
</script>
